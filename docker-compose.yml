services:
  clickhouse:
    image: ${CLICKHOUSE_IMAGE:?}
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE:?}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:?}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      TZ: ${TZ:?}
    ports:
      - "${CLICKHOUSE_HTTP_PORT:?}:8123"
      - "${CLICKHOUSE_PORT:?}:9000"
    volumes:
      - ./volume:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user \"$$CLICKHOUSE_USER\" --password \"$$CLICKHOUSE_PASSWORD\" --query 'SELECT 1'"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s

  app:
    build:
      context: .
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:?}
    env_file: .env.local
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_HTTP_PORT: 8123
      CLICKHOUSE_PORT: 9000
    ports:
      - "${APP_PORT:?}:${APP_PORT:?}"
    depends_on:
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.environ['APP_PORT'] + '/ping', timeout=2)"]
      interval: 2s
      timeout: 5s
      retries: 30
